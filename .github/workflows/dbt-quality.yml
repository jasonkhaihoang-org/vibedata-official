# dbt Quality (docs/design/domain-ci-release D9, D11): dbt-project-evaluator against a temporary copy of the
# Domain's packages.yml that adds the release's pinned evaluator. Advisory: it always passes, its findings are
# warnings. Released on its own (AC-1). domain-ci.yml runs the identical steps inline as its `dbt-quality` job
# (one `ci / dbt-quality`, AC-19); an invariant keeps the two in step. It writes `result-dbt-quality`.
name: dbt Quality

on:
  workflow_call: {}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  BASE_SHA: ${{ github.event.pull_request.base.sha }}

jobs:
  dbt-quality:
    name: dbt-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install --quiet "vibedata-domain-ci==1.0.0rc1"
      - run: vibedata-domain-ci install quality
      - id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: vibedata-domain-ci check dbt-quality
      - if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: result-dbt-quality
          path: results/result-dbt-quality.json
          if-no-files-found: ignore
